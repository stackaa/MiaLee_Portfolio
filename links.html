<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P4KPC04LGJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P4KPC04LGJ');
  </script>
  <title>Mia Min | Request the Portfolio</title>
  <meta name="description" content="Mia Min, Paris-based beauty, fashion &amp; lifestyle creator. Request the portfolio in a few seconds." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/jpeg" href="media/Capture d’écran 2025-02-03 201057.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,500;1,700&family=Quicksand:wght@300;400;500;600;700&family=Bodoni+Moda+SC:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/index-theme.css" />
  <link rel="stylesheet" href="css/links.css" />
</head>
<body data-page="links" data-theme="espresso">
  <main>
    <section id="contact" class="section section-beige text-white links">
      <div class="section-inner">
        <div class="links__intro">
          <img class="links__avatar" src="media/home_hero_mobil.webp" alt="Portrait of Mia Min" width="112" height="112" fetchpriority="high" />
          <span class="brand">Mia Min</span>
          <p class="links__tagline">Beauty, Fashion &amp; Lifestyle Creator · Paris</p>
        </div>

        <div class="section-head">
          <h2>Request <em>the</em> Portfolio</h2>
        </div>

        <form class="contact-form links-form" id="links-form">
          <div class="contact-form__row">
            <label class="contact-form__field">
              <span>Name</span>
              <input type="text" name="name" autocomplete="name" required />
            </label>
            <label class="contact-form__field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
          </div>

          <!-- Anti-bot trap: invisible to people, bots fill it in -->
          <input type="checkbox" name="botcheck" class="links-form__trap" tabindex="-1" autocomplete="off" aria-hidden="true" />

          <button type="submit" class="button button-outline">View the Portfolio</button>
          <p class="contact-form__status" role="status" aria-live="polite"></p>
          <p class="links-form__privacy">Your details and approximate location (city, country) are only used to follow up on your request.</p>
        </form>
      </div>
    </section>
  </main>

  <script>
    // Each request is (1) emailed via Web3Forms (same inbox as the site's
    // contact form) and (2) added as a row to Mia's Google Sheet (see
    // scripts/portfolio-requests-sheet.gs), then the visitor lands on the
    // official portfolio.
    const SITE = "https://miamincreative.com/";
    // Paste the Apps Script web app URL here (ends in /exec); empty = sheet off
    const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyhJQ5GSWn1nBNJPOKNOrgLPHMTeeRadMhe0pl_zTyWfTeMLHOMGgdu6AxC4N2V0Y5p/exec";
    const form = document.getElementById("links-form");
    const statusEl = form.querySelector(".contact-form__status");
    const submitButton = form.querySelector('button[type="submit"]');

    // Approximate location from the visitor's IP (country/city only,
    // no exact position). Fetched on page load so submitting isn't slowed.
    let geo = {};
    fetch("https://get.geojs.io/v1/ip/geo.json")
      .then((response) => response.json())
      .then((data) => {
        geo = { city: data.city || "", region: data.region || "", country: data.country || "" };
      })
      .catch(() => {});

    // Where the visitor came from: ?src=tiktok in the bio link wins,
    // otherwise the referring site (in-app browsers often send none)
    const params = new URLSearchParams(location.search);
    const referrer = params.get("src") || params.get("utm_source")
      || (document.referrer ? new URL(document.referrer).hostname : "Direct / unknown");
    // One Linktree serves both socials, but TikTok and Instagram open links
    // in their own in-app browser, which names the app — so we can still
    // tell which social the visitor came from
    const ua = navigator.userAgent;
    const app = /Instagram/i.test(ua) ? "Instagram"
      : /musical_ly|BytedanceWebview|TikTok/i.test(ua) ? "TikTok"
      : /FBAN|FBAV/i.test(ua) ? "Facebook"
      : "";
    const source = app ? `${app} app (via ${referrer})` : referrer;

    const withTimeout = (promise, ms) =>
      Promise.race([promise, new Promise((resolve) => setTimeout(resolve, ms))]);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = form.querySelector('[name="name"]').value.trim();
      const email = form.querySelector('[name="email"]').value.trim();

      // A bot ticked the hidden trap: send nothing, just move on
      if (form.querySelector('[name="botcheck"]').checked) {
        window.location.href = SITE;
        return;
      }

      const request = {
        name,
        email,
        city: geo.city || "",
        region: geo.region || "",
        country: geo.country || "",
        source,
        language: navigator.language || "",
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
        device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "Phone" : "Computer",
      };
      const place = [request.city, request.country].filter(Boolean).join(", ") || "unknown location";

      statusEl.textContent = "Opening the portfolio…";
      submitButton.disabled = true;

      gtag("event", "portfolio_request", { source });

      const saves = [
        fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            access_key: "2da7ec6d-1ebd-42f2-8add-d8fff8b2461d",
            subject: `Portfolio request: ${name} (${place})`,
            from_name: "Portfolio request page",
            ...request,
          }),
        }),
      ];
      if (SHEET_ENDPOINT) {
        // text/plain + no-cors: the only way a static page can post to Apps Script
        saves.push(fetch(SHEET_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(request),
        }));
      }

      // Don't keep the visitor waiting more than a few seconds; they still
      // get the portfolio even if saving fails
      await withTimeout(Promise.allSettled(saves), 5000);

      window.location.href = SITE;
    });
  </script>
</body>
</html>
